<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Predictor</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 44px;
      width: 100%;
      max-width: 480px;
    }

    /* ── Header ────────────────────────────────────────────────── */
    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-header .icon { font-size: 48px; line-height: 1; margin-bottom: 12px; }
    .card-header h1   { font-size: 1.6rem; font-weight: 700; color: #1a202c; }
    .card-header p    { font-size: .9rem; color: #718096; margin-top: 6px; }

    /* ── Form ──────────────────────────────────────────────────── */
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      background: #fff;
      outline: none;
      transition: border-color .2s;
      appearance: none;
    }
    input[type="number"]:focus,
    select:focus { border-color: #4299e1; }

    /* ── Button ────────────────────────────────────────────────── */
    button {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s, transform .1s;
    }
    button:hover  { background: #2563eb; }
    button:active { transform: scale(.98); }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── Result panel ──────────────────────────────────────────── */
    #result {
      margin-top: 28px;
      border-top: 1.5px solid #e2e8f0;
      padding-top: 24px;
      display: none;
    }
    #result.visible { display: block; }

    .result-title {
      text-align: center;
      font-size: .95rem;
      color: #718096;
      margin-bottom: 16px;
    }
    .result-title strong { color: #2d3748; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .metric-box {
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
    }
    .metric-box .metric-icon { font-size: 28px; margin-bottom: 6px; }
    .metric-box .metric-label {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #718096;
      margin-bottom: 4px;
    }
    .metric-box .metric-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
    }
    .metric-box .metric-unit {
      font-size: .8rem;
      color: #a0aec0;
      margin-top: 2px;
    }

    /* Temperature gets a warm tint, rainfall a cool tint */
    .metric-temp { border-color: #fbd38d; background: #fffaf0; }
    .metric-rain { border-color: #90cdf4; background: #ebf8ff; }

    /* ── Error message ─────────────────────────────────────────── */
    #error-msg {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 8px;
      color: #c53030;
      font-size: .88rem;
      display: none;
    }
    #error-msg.visible { display: block; }

    /* ── Footer ────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: .78rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="icon">&#x1F324;&#xFE0F;</div>
    <h1>Weather Predictor</h1>
    <p>Trained on 24 years of historical data &mdash; enter any year &amp; month.</p>
  </div>

  <!-- Form -->
  <div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="year" placeholder="e.g. 2025" min="1900" max="2100" value="2025" />
  </div>

  <div class="form-group">
    <label for="month">Month</label>
    <select id="month">
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7" selected>July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>
  </div>

  <button id="predict-btn" onclick="predict()">Predict</button>

  <!-- Error -->
  <div id="error-msg"></div>

  <!-- Result -->
  <div id="result">
    <p class="result-title">Prediction for <strong id="result-label"></strong></p>
    <div class="metrics">
      <div class="metric-box metric-temp">
        <div class="metric-icon">&#x1F321;&#xFE0F;</div>
        <div class="metric-label">Temperature</div>
        <div class="metric-value" id="temp-value">--</div>
        <div class="metric-unit">degrees Celsius</div>
      </div>
      <div class="metric-box metric-rain">
        <div class="metric-icon">&#x1F327;&#xFE0F;</div>
        <div class="metric-label">Rainfall</div>
        <div class="metric-value" id="rain-value">--</div>
        <div class="metric-unit">millimetres</div>
      </div>
    </div>
  </div>

  <p class="footer">Weather Predictor &mdash; Linear Regression model &bull; 2001&ndash;2024 data</p>

</div>

<script>
  const MONTH_NAMES = [
    "", "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  async function predict() {
    const yearEl  = document.getElementById("year");
    const monthEl = document.getElementById("month");
    const btn     = document.getElementById("predict-btn");
    const errEl   = document.getElementById("error-msg");
    const resEl   = document.getElementById("result");

    const year  = parseInt(yearEl.value, 10);
    const month = parseInt(monthEl.value, 10);

    // Client-side validation
    errEl.className = "";
    if (!year || year < 1900 || year > 2100) {
      showError("Please enter a valid year between 1900 and 2100.");
      return;
    }

    // Call the Flask API
    btn.disabled  = true;
    btn.textContent = "Predicting...";

    try {
      const response = await fetch("/predict", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ year, month }),
      });

      const data = await response.json();

      if (!response.ok) {
        showError(data.error || "Something went wrong.");
        return;
      }

      // Show results
      document.getElementById("result-label").textContent =
        MONTH_NAMES[month] + " " + year;
      document.getElementById("temp-value").textContent = data.temperature.toFixed(1);
      document.getElementById("rain-value").textContent = Math.round(data.rainfall);

      resEl.className = "visible";
      errEl.className = "";

    } catch (err) {
      showError("Could not reach the server. Is app.py running?");
    } finally {
      btn.disabled = false;
      btn.textContent = "Predict";
    }
  }

  function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.className = "visible";
    document.getElementById("result").className = "";
  }

  // Allow pressing Enter in the year field to trigger prediction
  document.getElementById("year").addEventListener("keydown", function(e) {
    if (e.key === "Enter") predict();
  });
</script>

</body>
</html>
